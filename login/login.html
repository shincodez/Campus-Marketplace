<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Campus Marketplace</title>

    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>


<body>

<div class="login-page">


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="top-bar">

        <button
            type="button"
            class="back-button"
            id="backButton"
            aria-label="Go back"
        >

            <svg viewBox="0 0 24 24">

                <path d="M19 12H5"></path>

                <path d="M12 19L5 12L12 5"></path>

            </svg>

        </button>

    </header>



    <!-- ==========================================
         BRAND
    =========================================== -->

    <main>

        <section class="brand-section">


            <!-- Illustration -->

            <div class="brand-illustration">

                <svg
                    viewBox="0 0 320 260"
                    class="graduation-svg"
                >

                    <!-- Background -->

                    <ellipse
                        cx="145"
                        cy="155"
                        rx="105"
                        ry="62"
                        fill="#eef5ff"
                    ></ellipse>


                    <!-- BOOK -->

                    <path
                        d="M48 156
                           L202 137
                           L245 161
                           L88 184
                           Z"
                        fill="#ffffff"
                        stroke="#0b43a5"
                        stroke-width="3"
                    ></path>


                    <path
                        d="M88 184
                           L245 161
                           L245 178
                           L90 201
                           Z"
                        fill="#ffffff"
                        stroke="#0b43a5"
                        stroke-width="3"
                    ></path>


                    <!-- Book lines -->

                    <path
                        d="M103 161 L207 149"
                        stroke="#9aa8be"
                        stroke-width="2"
                    ></path>

                    <path
                        d="M105 168 L214 155"
                        stroke="#9aa8be"
                        stroke-width="2"
                    ></path>

                    <path
                        d="M108 175 L220 161"
                        stroke="#9aa8be"
                        stroke-width="2"
                    ></path>


                    <!-- SECOND BOOK -->

                    <path
                        d="M57 140
                           L202 125
                           L239 148
                           L90 169
                           Z"
                        fill="#ffffff"
                        stroke="#0b43a5"
                        stroke-width="3"
                    ></path>


                    <path
                        d="M90 169
                           L239 148
                           L239 162
                           L90 183
                           Z"
                        fill="#ffffff"
                        stroke="#0b43a5"
                        stroke-width="3"
                    ></path>


                    <!-- GRADUATION CAP -->

                    <path
                        d="M54 81
                           L160 39
                           L267 79
                           L161 121
                           Z"
                        fill="#2563d9"
                        stroke="#082f78"
                        stroke-width="3"
                    ></path>


                    <!-- Cap -->

                    <path
                        d="M106 99
                           L106 134
                           C106 164 215 164 215 134
                           L215 99
                           L161 121
                           Z"
                        fill="#1251c7"
                        stroke="#082f78"
                        stroke-width="3"
                    ></path>


                    <!-- Cap button -->

                    <ellipse
                        cx="160"
                        cy="72"
                        rx="10"
                        ry="5"
                        fill="white"
                        stroke="#082f78"
                        stroke-width="2"
                    ></ellipse>


                    <!-- Tassel -->

                    <path
                        d="M169 73
                           L242 84
                           L242 119"
                        fill="none"
                        stroke="#f5a400"
                        stroke-width="3"
                    ></path>


                    <path
                        d="M237 119
                           L247 119
                           L247 142
                           L237 142
                           Z"
                        fill="#f5a400"
                        stroke="#082f78"
                        stroke-width="2"
                    ></path>


                    <!-- PLANT -->

                    <path
                        d="M275 107
                           C275 135 275 158 275 180"
                        fill="none"
                        stroke="#174dcc"
                        stroke-width="3"
                    ></path>


                    <path
                        d="M275 126
                           C258 119 254 108 260 100
                           C269 103 274 113 275 126"
                        fill="none"
                        stroke="#174dcc"
                        stroke-width="3"
                    ></path>


                    <path
                        d="M275 143
                           C293 136 297 125 292 117
                           C284 120 278 131 275 143"
                        fill="none"
                        stroke="#174dcc"
                        stroke-width="3"
                    ></path>


                    <path
                        d="M275 159
                           C258 153 253 143 257 135
                           C266 138 272 148 275 159"
                        fill="none"
                        stroke="#174dcc"
                        stroke-width="3"
                    ></path>


                    <path
                        d="M275 171
                           C291 166 296 158 293 151
                           C285 154 279 162 275 171"
                        fill="none"
                        stroke="#174dcc"
                        stroke-width="3"
                    ></path>


                    <!-- POT -->

                    <path
                        d="M258 180
                           L293 180
                           L287 211
                           L264 211
                           Z"
                        fill="#ffffff"
                        stroke="#174dcc"
                        stroke-width="3"
                    ></path>

                </svg>

            </div>


            <!-- Brand -->

            <div class="brand-name">

                <div class="campus">
                    CAMPUS
                </div>

                <div class="marketplace">
                    MARKETPLACE
                </div>

            </div>


            <h1>
                Buy. Sell. Connect.
            </h1>


            <p>
                Everything you need, right here on campus.
            </p>

        </section>



        <!-- ==========================================
             AUTHENTICATION
        =========================================== -->

        <section class="auth-section">


            <!-- Tabs -->

            <div class="auth-tabs">

                <button
                    type="button"
                    class="auth-tab active"
                    id="loginTab"
                >
                    Login
                </button>

                <button
                    type="button"
                    class="auth-tab"
                    id="signupTab"
                >
                    Sign Up
                </button>

            </div>



            <!-- ======================================
                 LOGIN
            ======================================= -->

            <form
                class="auth-form active"
                id="loginForm"
            >


                <!-- Email -->

                <div class="input-group">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            ></rect>

                            <path
                                d="M3 7L12 13L21 7"
                            ></path>

                        </svg>

                    </div>


                    <input
                        type="text"
                        id="loginEmail"
                        placeholder="Email or Student ID"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- Password -->

                <div class="input-group">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="11"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7
                                   C8 4 16 4 16 7V10"
                            ></path>

                            <circle
                                cx="12"
                                cy="15"
                                r="1"
                            ></circle>

                        </svg>

                    </div>


                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                    >

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M2 12
                                   C4.5 7
                                   8 5
                                   12 5
                                   C16 5
                                   19.5 7
                                   22 12
                                   C19.5 17
                                   16 19
                                   12 19
                                   C8 19
                                   4.5 17
                                   2 12Z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>

                    </button>

                </div>



                <!-- Forgot -->

                <div class="forgot-row">

                    <button
                        type="button"
                        class="forgot-button"
                        id="forgotPassword"
                    >
                        Forgot password?
                    </button>

                </div>



                <!-- Login -->

                <button
                    type="submit"
                    class="primary-button"
                >
                    Login
                </button>



                <!-- Divider -->

                <div class="divider">

                    <span></span>

                    <p>or</p>

                    <span></span>

                </div>



                <!-- Google -->

                <button
                    type="button"
                    class="social-button"
                    id="googleButton"
                >

                    <span class="social-logo google-logo">
                        G
                    </span>

                    <span>
                        Continue with Google
                    </span>

                </button>



                <!-- Facebook -->

                <button
                    type="button"
                    class="social-button"
                    id="facebookButton"
                >

                    <span class="social-logo facebook-logo">
                        f
                    </span>

                    <span>
                        Continue with Facebook
                    </span>

                </button>



                <!-- School -->

                <button
                    type="button"
                    class="social-button"
                    id="schoolButton"
                >

                    <span class="social-logo school-logo">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M12 2L20 5V11
                                   C20 16
                                   17 19
                                   12 22
                                   C7 19
                                   4 16
                                   4 11V5Z"
                            ></path>

                            <path
                                d="M8 12L11 15L17 9"
                            ></path>

                        </svg>

                    </span>

                    <span>
                        Continue with School Account
                    </span>

                </button>



                <!-- Security -->

                <div class="security-card">

                    <div class="security-icon">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M12 2L20 5V11
                                   C20 16
                                   17 19
                                   12 22
                                   C7 19
                                   4 16
                                   4 11V5Z"
                            ></path>

                            <path
                                d="M8 12L11 15L17 9"
                            ></path>

                        </svg>

                    </div>


                    <div class="security-text">

                        <strong>
                            Only verified students can buy and sell.
                        </strong>

                        <span>
                            Your information is safe with us.
                        </span>

                    </div>

                </div>

            </form>



            <!-- ======================================
                 SIGN UP
            ======================================= -->

            <form
                class="auth-form"
                id="signupForm"
            >


                <div class="input-group">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <circle
                                cx="12"
                                cy="7"
                                r="4"
                            ></circle>

                            <path
                                d="M4 21
                                   C4 17
                                   7 14
                                   12 14
                                   C17 14
                                   20 17
                                   20 21"
                            ></path>

                        </svg>

                    </div>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Full Name"
                        required
                    >

                </div>



                <div class="input-group">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            ></rect>

                            <path
                                d="M3 7L12 13L21 7"
                            ></path>

                        </svg>

                    </div>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="School Email"
                        required
                    >

                </div>



                <div class="input-group">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="11"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7
                                   C8 4 16 4 16 7V10"
                            ></path>

                        </svg>

                    </div>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create Password"
                        required
                    >

                </div>



                <div class="input-group">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="11"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7
                                   C8 4 16 4 16 7V10"
                            ></path>

                        </svg>

                    </div>

                    <input
                        type="password"
                        id="signupConfirmPassword"
                        placeholder="Confirm Password"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="primary-button"
                >
                    Create Account
                </button>



                <div class="security-card">

                    <div class="security-icon">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M12 2L20 5V11
                                   C20 16
                                   17 19
                                   12 22
                                   C7 19
                                   4 16
                                   4 11V5Z"
                            ></path>

                            <path
                                d="M8 12L11 15L17 9"
                            ></path>

                        </svg>

                    </div>


                    <div class="security-text">

                        <strong>
                            Student verification required.
                        </strong>

                        <span>
                            Only verified students can join.
                        </span>

                    </div>

                </div>

            </form>

        </section>

    </main>



    <!-- ==========================================
         TOAST
    =========================================== -->

    <div
        class="toast"
        id="toast"
    >
        <span id="toastMessage"></span>
    </div>


</div>


<script src="login.js"></script>

</body>

</html>
