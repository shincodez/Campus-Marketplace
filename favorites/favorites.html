<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1457d9">
  <title>Favorites | Campus Marketplace</title>
  <link rel="stylesheet" href="favorites.css">
  <script src="favorites.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <button class="icon-button" id="backButton" aria-label="Go back">
        <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"></path></svg>
      </button>
      <h1>Favorites</h1>
      <div class="header-spacer"></div>
    </header>

    <section class="content">
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="favoriteSearch" type="search" placeholder="Search favorites..." autocomplete="off">
        <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search">×</button>
      </div>

      <div class="tabs" role="tablist" aria-label="Favorite item status">
        <button class="tab active" data-tab="all" role="tab">All Items</button>
        <button class="tab" data-tab="sale" role="tab">For Sale</button>
        <button class="tab" data-tab="sold" role="tab">Sold</button>
      </div>

      <div class="result-row">
        <h2>Saved Items</h2>
        <span id="resultCount">0 items</span>
      </div>

      <section id="favoriteList" class="favorite-list" aria-live="polite"></section>

      <section id="emptyState" class="empty-state hidden">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24"><path d="M20.8 8.6c0 5.4-8.8 11-8.8 11S3.2 14 3.2 8.6A4.6 4.6 0 0 1 12 6a4.6 4.6 0 0 1 8.8 2.6Z"></path></svg>
        </div>
        <h2>No saved items</h2>
        <p>Items you save will appear here.</p>
        <button class="primary-button" id="browseButton">Browse Marketplace</button>
      </section>

      <section class="privacy-card">
        <div class="privacy-icon">
          <svg viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.2 8.4-8 10-4.8-1.6-8-5-8-10V6l8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg>
        </div>
        <div>
          <h3>Your favorites are private</h3>
          <p>Only you can see the items you save.</p>
        </div>
      </section>
    </section>

    <nav class="bottom-nav" aria-label="Mobile navigation">
      <button class="nav-item" data-nav="home" type="button"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10Z"></path></svg><span>Home</span></button>
      <button class="nav-item" data-nav="marketplace" type="button"><svg viewBox="0 0 24 24"><path d="M4 9h16v11H4z"></path><path d="M3 9 5 4h14l2 5"></path><path d="M8 9v3M12 9v3M16 9v3"></path></svg><span>Marketplace</span></button>
      <button class="sell-button" data-nav="post" type="button" aria-label="Post an item"><span>+</span></button>
      <button class="nav-item active" data-nav="favorites" type="button"><svg viewBox="0 0 24 24"><path d="M20.8 8.6c0 5.4-8.8 11-8.8 11S3.2 14 3.2 8.6A4.6 4.6 0 0 1 12 6a4.6 4.6 0 0 1 8.8 2.6Z"></path></svg><span>Favorites</span></button>
      <button class="nav-item" data-nav="profile" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span>Profile</span></button>
    </nav>

    <div class="toast" id="toast" role="status"></div>
  </main>
</body>
</html>
