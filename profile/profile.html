<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1457d9">
  <title>Profile | Campus Marketplace</title>
  <link rel="stylesheet" href="profile.css">
  <script src="profile.js" defer></script>
    <link rel="stylesheet" href="../nav.css">
</head>
<body>
<main class="app">
  <header class="page-header"><button class="icon-button" id="backButton" aria-label="Go back"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"></path></svg></button><h1>Profile</h1><button class="settings-button" id="settingsButton" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"></path><circle cx="12" cy="12" r="3.2"></circle></svg></button></header>
  <section class="content">
    <section class="profile-card"><div class="avatar" id="avatar">ME</div><div class="profile-main"><h2 id="profileName">Campus Student</h2><p id="profileEmail">student@campus.edu</p><div class="verified"><span>✓</span> Verified Student</div></div></section>
    <div class="profile-location"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg><span id="profileLocation">Campus</span><span class="dot">•</span><span>Joined <span id="joinDate">2024</span></span></div>

    <section class="section"><h2>Student Verification</h2><div class="action-card"><div class="card-icon blue"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"></path><circle cx="9" cy="11" r="2"></circle><path d="M13 10h4M13 13h4"></path></svg></div><div class="action-copy"><strong>Verified student</strong><span>Your account has been verified.</span></div><button id="viewId" class="text-button">View ID</button></div></section>

    <section class="section"><h2>My Activity</h2><div class="stats-grid"><button class="stat-card" data-action="bought"><strong>0</strong><span>Items Bought</span></button><button class="stat-card" data-action="sold"><strong id="soldCount">0</strong><span>Items Sold</span></button><button class="stat-card" data-action="favorites"><strong id="favoriteCount">0</strong><span>Favorites</span></button><button class="stat-card" data-action="messages"><strong>0</strong><span>Messages</span></button></div></section>

    <section class="section"><h2>Selling Tools</h2><div class="menu-card"><button data-action="listings"><span class="menu-icon">▣</span><span>My Listings</span><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg></button><button data-action="sold"><span class="menu-icon">✓</span><span>Sold Items</span><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg></button><button data-action="analytics"><span class="menu-icon">↗</span><span>Sales Analytics</span><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg></button></div></section>

    <section class="section"><h2>Account</h2><div class="menu-card"><button data-action="personal"><span class="menu-icon">◎</span><span>Personal Information</span><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg></button><button data-action="verification"><span class="menu-icon">✓</span><span>Verification</span><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg></button><button data-action="security"><span class="menu-icon">◇</span><span>Security</span><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg></button><button data-action="notifications"><span class="menu-icon">◌</span><span>Notifications</span><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg></button></div></section>
    <button class="signout" id="signOut">Sign Out</button>
  </section>
  <nav class="bottom-nav" aria-label="Primary navigation">
      <div class="nav-brand" aria-label="Campus Marketplace">
        <span class="nav-brand-campus">CAMPUS</span>
        <span class="nav-brand-marketplace">MARKETPLACE</span>
      </div>
      <button class="nav-item" data-nav="home" data-page="home" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"></path><path d="M5.5 9.5V20h13V9.5"></path><path d="M9.5 20v-6h5v6"></path></svg><span>Home</span></button>
      <button class="nav-item" data-nav="marketplace" data-page="marketplace" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14l1 11H4L5 9Z"></path><path d="M8 9V6.5a4 4 0 0 1 8 0V9"></path></svg><span>Marketplace</span></button>
      <button class="sell-button" data-nav="post" id="sellButton" type="button" aria-label="Post an item"><span class="sell-plus">+</span><span class="sell-label">Post an Item</span></button>
      <button class="nav-item" data-nav="favorites" data-page="favorites" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 8.7c0 5.1-8.2 10.5-8.2 10.5S3.8 13.8 3.8 8.7A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.2 2.5Z"></path></svg><span>Favorites</span></button>
      <button class="nav-item active" data-nav="profile" data-page="profile" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20.5c.8-4.3 3.3-6.8 7.5-6.8s6.7 2.5 7.5 6.8"></path></svg><span>Profile</span></button>
    </nav>
  <div class="toast" id="toast" role="status"></div>
</main>
</body>
</html>
