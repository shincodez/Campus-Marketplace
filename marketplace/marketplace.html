<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Marketplace | Campus Marketplace</title>

    <link rel="stylesheet" href="marketplace.css">
    <script src="marketplace.js" defer></script>
    <link rel="stylesheet" href="../nav.css">
</head>

<body>

    <div class="app">

        <!-- =========================
             TOP HEADER
        ========================== -->
        <header class="top-header">

            <button
                class="icon-button"
                id="menuButton"
                type="button"
                aria-label="Open menu"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <h1 class="page-title">Marketplace</h1>

            <button
                class="icon-button cart-button"
                id="cartButton"
                type="button"
                aria-label="Shopping cart"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 4h2l2.1 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L21 7H6"></path>
                    <circle cx="10" cy="20" r="1.4"></circle>
                    <circle cx="18" cy="20" r="1.4"></circle>
                </svg>

                <span class="cart-count" id="cartCount">0</span>
            </button>

        </header>


        <!-- =========================
             SEARCH
        ========================== -->
        <section class="search-section">

            <div class="search-row">

                <div class="search-box">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search items..."
                        autocomplete="off"
                    >

                    <button
                        class="clear-search"
                        id="clearSearch"
                        type="button"
                        aria-label="Clear search"
                    >
                        ×
                    </button>

                </div>

                <button
                    class="filter-button"
                    id="filterButton"
                    type="button"
                    aria-label="Filters"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 6h16M7 12h10M10 18h4"></path>
                        <circle cx="8" cy="6" r="1.5"></circle>
                        <circle cx="16" cy="12" r="1.5"></circle>
                        <circle cx="12" cy="18" r="1.5"></circle>
                    </svg>
                </button>

            </div>

        </section>


        <!-- =========================
             CATEGORY SCROLLER
        ========================== -->
        <section class="categories-section">

            <div class="category-list" id="categoryList">

                <button class="category-item active" data-category="All">
                    <span class="category-icon category-all" aria-hidden="true">🛍️</span>
                    <span>All</span>
                </button>

                <button class="category-item" data-category="Books">
                    <span class="category-icon category-books" aria-hidden="true">📚</span>
                    <span>Books</span>
                </button>

                <button class="category-item" data-category="Electronics">
                    <span class="category-icon category-electronics" aria-hidden="true">💻</span>
                    <span>Electronics</span>
                </button>

                <button class="category-item" data-category="Uniforms">
                    <span class="category-icon category-uniforms" aria-hidden="true">👕</span>
                    <span>Uniforms</span>
                </button>

                <button class="category-item" data-category="Supplies">
                    <span class="category-icon category-supplies" aria-hidden="true">✏️</span>
                    <span>Supplies</span>
                </button>

                <button class="category-item" data-category="More">
                    <span class="category-icon category-more" aria-hidden="true">•••</span>
                    <span>More</span>
                </button>

            </div>

        </section>


        <!-- =========================
             POPULAR ITEMS
        ========================== -->
        <main class="marketplace-content">

            <div class="section-heading">

                <div>
                    <h2>Popular Items</h2>
                    <span id="resultsCount">6 items</span>
                </div>

                <button id="viewAllButton" type="button">
                    View all
                </button>

            </div>


            <!-- Product list -->
            <section
                class="product-list"
                id="productList"
                aria-live="polite"
            ></section>


            <!-- Empty state -->
            <section
                class="empty-state hidden"
                id="emptyState"
            >

                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>
                </div>

                <h3>No items found</h3>

                <p>
                    Try a different search or category.
                </p>

                <button
                    class="primary-button"
                    id="resetButton"
                    type="button"
                >
                    Clear filters
                </button>

            </section>

        </main>


        <!-- =========================
             BOTTOM NAVIGATION
        ========================== -->
        <nav class="bottom-nav" aria-label="Primary navigation">
      <div class="nav-brand" aria-label="Campus Marketplace">
        <span class="nav-brand-campus">CAMPUS</span>
        <span class="nav-brand-marketplace">MARKETPLACE</span>
      </div>
      <button class="nav-item" data-nav="home" data-page="home" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"></path><path d="M5.5 9.5V20h13V9.5"></path><path d="M9.5 20v-6h5v6"></path></svg><span>Home</span></button>
      <button class="nav-item active" data-nav="marketplace" data-page="marketplace" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14l1 11H4L5 9Z"></path><path d="M8 9V6.5a4 4 0 0 1 8 0V9"></path></svg><span>Marketplace</span></button>
      <button class="sell-button" data-nav="post" id="sellButton" type="button" aria-label="Post an item"><span class="sell-plus">+</span><span class="sell-label">Post an Item</span></button>
      <button class="nav-item" data-nav="favorites" data-page="favorites" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 8.7c0 5.1-8.2 10.5-8.2 10.5S3.8 13.8 3.8 8.7A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.2 2.5Z"></path></svg><span>Favorites</span></button>
      <button class="nav-item" data-nav="profile" data-page="profile" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20.5c.8-4.3 3.3-6.8 7.5-6.8s6.7 2.5 7.5 6.8"></path></svg><span>Profile</span></button>
    </nav>


        <!-- =========================
             FILTER MODAL
        ========================== -->
        <div class="overlay hidden" id="filterOverlay">

            <div
                class="bottom-sheet"
                role="dialog"
                aria-modal="true"
                aria-labelledby="filterTitle"
            >

                <div class="sheet-handle"></div>

                <div class="sheet-header">
                    <h2 id="filterTitle">Filter & Sort</h2>

                    <button
                        id="closeFilter"
                        type="button"
                        aria-label="Close filters"
                    >
                        ×
                    </button>
                </div>


                <div class="filter-group">

                    <label>Condition</label>

                    <div class="filter-options">

                        <button
                            class="filter-chip active"
                            data-condition="All"
                            type="button"
                        >
                            All
                        </button>

                        <button
                            class="filter-chip"
                            data-condition="New"
                            type="button"
                        >
                            New
                        </button>

                        <button
                            class="filter-chip"
                            data-condition="Used"
                            type="button"
                        >
                            Used
                        </button>

                    </div>

                </div>


                <div class="filter-group">

                    <label for="sortSelect">
                        Sort by
                    </label>

                    <select id="sortSelect">
                        <option value="popular">Popular</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Highest Rated</option>
                        <option value="newest">Newest</option>
                    </select>

                </div>


                <div class="sheet-actions">

                    <button
                        class="secondary-button"
                        id="clearFilters"
                        type="button"
                    >
                        Reset
                    </button>

                    <button
                        class="primary-button"
                        id="applyFilters"
                        type="button"
                    >
                        Apply filters
                    </button>

                </div>

            </div>

        </div>


        <!-- =========================
             PRODUCT DETAILS MODAL
        ========================== -->
        <div class="overlay hidden" id="productOverlay">

            <div
                class="product-modal"
                role="dialog"
                aria-modal="true"
            >

                <button
                    class="modal-close"
                    id="closeProduct"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>

                <div id="productDetails"></div>

            </div>

        </div>


        <!-- =========================
             CART DRAWER
        ========================== -->
        <div class="overlay hidden" id="cartOverlay">

            <div class="cart-sheet">

                <div class="sheet-handle"></div>

                <div class="sheet-header">

                    <h2>Your Cart</h2>

                    <button
                        id="closeCart"
                        type="button"
                        aria-label="Close cart"
                    >
                        ×
                    </button>

                </div>

                <div id="cartContent"></div>

            </div>

        </div>


        <!-- =========================
             TOAST
        ========================== -->
        <div
            class="toast"
            id="toast"
            role="status"
            aria-live="polite"
        ></div>


        <!-- =========================
             SIDE MENU
        ========================== -->
        <div class="overlay hidden" id="menuOverlay">

            <div class="side-menu">

                <button
                    class="modal-close"
                    id="closeMenu"
                    type="button"
                    aria-label="Close menu"
                >
                    ×
                </button>

                <div class="menu-brand">
                    <strong>CAMPUS</strong>
                    <span>MARKETPLACE</span>
                </div>

                <div class="menu-links">

                    <button data-menu="home" type="button">
                        🏠 Home
                    </button>

                    <button data-menu="marketplace" type="button">
                        🛍️ Marketplace
                    </button>

                    <button data-menu="favorites" type="button">
                        ❤️ Favorites
                    </button>

                    <button data-menu="profile" type="button">
                        👤 Profile
                    </button>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
