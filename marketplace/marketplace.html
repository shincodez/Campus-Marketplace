<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Marketplace | Campus Marketplace</title>

    <link rel="stylesheet" href="marketplace.css">
    <script src="marketplace.js" defer></script>
</head>

<body>

    <div class="app">

        <!-- =========================
             TOP HEADER
        ========================== -->
        <header class="top-header">

            <button
                class="icon-button"
                id="menuButton"
                type="button"
                aria-label="Open menu"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <h1 class="page-title">Marketplace</h1>

            <button
                class="icon-button cart-button"
                id="cartButton"
                type="button"
                aria-label="Shopping cart"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 4h2l2.1 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L21 7H6"></path>
                    <circle cx="10" cy="20" r="1.4"></circle>
                    <circle cx="18" cy="20" r="1.4"></circle>
                </svg>

                <span class="cart-count" id="cartCount">0</span>
            </button>

        </header>


        <!-- =========================
             SEARCH
        ========================== -->
        <section class="search-section">

            <div class="search-row">

                <div class="search-box">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search items..."
                        autocomplete="off"
                    >

                    <button
                        class="clear-search"
                        id="clearSearch"
                        type="button"
                        aria-label="Clear search"
                    >
                        ×
                    </button>

                </div>

                <button
                    class="filter-button"
                    id="filterButton"
                    type="button"
                    aria-label="Filters"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 6h16M7 12h10M10 18h4"></path>
                        <circle cx="8" cy="6" r="1.5"></circle>
                        <circle cx="16" cy="12" r="1.5"></circle>
                        <circle cx="12" cy="18" r="1.5"></circle>
                    </svg>
                </button>

            </div>

        </section>


        <!-- =========================
             CATEGORY SCROLLER
        ========================== -->
        <section class="categories-section">

            <div class="category-list" id="categoryList">

                <button class="category-item active" data-category="All">
                    <span class="category-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 8h12l1 12H5L6 8Z"></path>
                            <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
                        </svg>
                    </span>
                    <span>All</span>
                </button>

                <button class="category-item" data-category="Books">
                    <span class="category-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 4h5a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Z"></path>
                            <path d="M19 4h-5a2 2 0 0 0-2 2v14h5a2 2 0 0 0 2-2V4Z"></path>
                        </svg>
                    </span>
                    <span>Books</span>
                </button>

                <button class="category-item" data-category="Electronics">
                    <span class="category-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="4" width="16" height="13" rx="2"></rect>
                            <path d="M8 21h8M12 17v4"></path>
                        </svg>
                    </span>
                    <span>Electronics</span>
                </button>

                <button class="category-item" data-category="Uniforms">
                    <span class="category-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m8 5 4-2 4 2 4 4-3 3-2-2v11H9V10l-2 2-3-3 4-4Z"></path>
                        </svg>
                    </span>
                    <span>Uniforms</span>
                </button>

                <button class="category-item" data-category="Supplies">
                    <span class="category-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 7V5a4 4 0 0 1 8 0v2"></path>
                            <rect x="5" y="7" width="14" height="13" rx="3"></rect>
                            <path d="M9 12h6"></path>
                        </svg>
                    </span>
                    <span>Supplies</span>
                </button>

                <button class="category-item" data-category="More">
                    <span class="category-icon">
                        <span class="more-dots">•••</span>
                    </span>
                    <span>More</span>
                </button>

            </div>

        </section>


        <!-- =========================
             POPULAR ITEMS
        ========================== -->
        <main class="marketplace-content">

            <div class="section-heading">

                <div>
                    <h2>Popular Items</h2>
                    <span id="resultsCount">6 items</span>
                </div>

                <button id="viewAllButton" type="button">
                    View all
                </button>

            </div>


            <!-- Product list -->
            <section
                class="product-list"
                id="productList"
                aria-live="polite"
            ></section>


            <!-- Empty state -->
            <section
                class="empty-state hidden"
                id="emptyState"
            >

                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>
                </div>

                <h3>No items found</h3>

                <p>
                    Try a different search or category.
                </p>

                <button
                    class="primary-button"
                    id="resetButton"
                    type="button"
                >
                    Clear filters
                </button>

            </section>

        </main>


        <!-- =========================
             BOTTOM NAVIGATION
        ========================== -->
        <nav class="bottom-nav">

            <button
                class="nav-item"
                data-nav="home"
                type="button"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10Z"></path>
                </svg>
                <span>Home</span>
            </button>


            <button
                class="nav-item active"
                data-nav="marketplace"
                type="button"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 9h16v11H4z"></path>
                    <path d="M3 9 5 4h14l2 5"></path>
                    <path d="M8 9v3M12 9v3M16 9v3"></path>
                </svg>
                <span>Marketplace</span>
            </button>


            <button
                class="sell-button"
                id="sellButton"
                type="button"
                aria-label="Sell an item"
            >
                <span>+</span>
            </button>


            <button
                class="nav-item"
                data-nav="favorites"
                type="button"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.8 8.6c0 5.4-8.8 11-8.8 11s-8.8-5.6-8.8-11A4.6 4.6 0 0 1 12 6a4.6 4.6 0 0 1 8.8 2.6Z"></path>
                </svg>
                <span>Favorites</span>
            </button>


            <button
                class="nav-item"
                data-nav="profile"
                type="button"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21a8 8 0 0 1 16 0"></path>
                </svg>
                <span>Profile</span>
            </button>

        </nav>


        <!-- =========================
             FILTER MODAL
        ========================== -->
        <div class="overlay hidden" id="filterOverlay">

            <div
                class="bottom-sheet"
                role="dialog"
                aria-modal="true"
                aria-labelledby="filterTitle"
            >

                <div class="sheet-handle"></div>

                <div class="sheet-header">
                    <h2 id="filterTitle">Filter & Sort</h2>

                    <button
                        id="closeFilter"
                        type="button"
                        aria-label="Close filters"
                    >
                        ×
                    </button>
                </div>


                <div class="filter-group">

                    <label>Condition</label>

                    <div class="filter-options">

                        <button
                            class="filter-chip active"
                            data-condition="All"
                            type="button"
                        >
                            All
                        </button>

                        <button
                            class="filter-chip"
                            data-condition="New"
                            type="button"
                        >
                            New
                        </button>

                        <button
                            class="filter-chip"
                            data-condition="Used"
                            type="button"
                        >
                            Used
                        </button>

                    </div>

                </div>


                <div class="filter-group">

                    <label for="sortSelect">
                        Sort by
                    </label>

                    <select id="sortSelect">
                        <option value="popular">Popular</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Highest Rated</option>
                        <option value="newest">Newest</option>
                    </select>

                </div>


                <div class="sheet-actions">

                    <button
                        class="secondary-button"
                        id="clearFilters"
                        type="button"
                    >
                        Reset
                    </button>

                    <button
                        class="primary-button"
                        id="applyFilters"
                        type="button"
                    >
                        Apply filters
                    </button>

                </div>

            </div>

        </div>


        <!-- =========================
             PRODUCT DETAILS MODAL
        ========================== -->
        <div class="overlay hidden" id="productOverlay">

            <div
                class="product-modal"
                role="dialog"
                aria-modal="true"
            >

                <button
                    class="modal-close"
                    id="closeProduct"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>

                <div id="productDetails"></div>

            </div>

        </div>


        <!-- =========================
             CART DRAWER
        ========================== -->
        <div class="overlay hidden" id="cartOverlay">

            <div class="cart-sheet">

                <div class="sheet-handle"></div>

                <div class="sheet-header">

                    <h2>Your Cart</h2>

                    <button
                        id="closeCart"
                        type="button"
                        aria-label="Close cart"
                    >
                        ×
                    </button>

                </div>

                <div id="cartContent"></div>

            </div>

        </div>




        <!-- =========================
             POST ITEM MODAL
        ========================== -->
        <div class="overlay hidden" id="postOverlay">
            <div class="post-sheet" role="dialog" aria-modal="true" aria-labelledby="postTitle">
                <div class="sheet-handle"></div>
                <div class="sheet-header">
                    <h2 id="postTitle">Post an Item</h2>
                    <button id="closePost" type="button" aria-label="Close">×</button>
                </div>

                <form id="postForm" class="post-form">
                    <label for="postImage">Image</label>
                    <input id="postImage" name="image" type="file" accept="image/*">
                    <div class="image-preview hidden" id="imagePreviewWrap">
                        <img id="imagePreview" alt="Listing preview">
                    </div>

                    <label for="postName">Item name</label>
                    <input id="postName" name="name" type="text" maxlength="60" placeholder="e.g. Calculus Textbook" required>

                    <div class="form-two-col">
                        <div>
                            <label for="postPrice">Price</label>
                            <input id="postPrice" name="price" type="number" min="1" step="1" placeholder="500" required>
                        </div>
                        <div>
                            <label for="postCondition">Condition</label>
                            <select id="postCondition" name="condition">
                                <option>New</option>
                                <option selected>Used</option>
                            </select>
                        </div>
                    </div>

                    <label for="postCategory">Category</label>
                    <select id="postCategory" name="category">
                        <option>Books</option>
                        <option>Electronics</option>
                        <option>Uniforms</option>
                        <option>Supplies</option>
                        <option>Sports</option>
                        <option>Furniture</option>
                        <option>Accessories</option>
                        <option>Others</option>
                    </select>

                    <label for="postLocation">Meet-up / location</label>
                    <input id="postLocation" name="location" type="text" maxlength="60" placeholder="Near Library" required>

                    <label for="postDescription">Description</label>
                    <textarea id="postDescription" name="description" rows="4" maxlength="500" placeholder="Tell buyers about the item..."></textarea>

                    <label for="postSeller">Seller name</label>
                    <input id="postSeller" name="seller" type="text" maxlength="40" placeholder="Your name" required>

                    <button class="primary-button" type="submit">Publish listing</button>
                </form>
            </div>
        </div>


        <!-- =========================
             TOAST
        ========================== -->
        <div
            class="toast"
            id="toast"
            role="status"
            aria-live="polite"
        ></div>


        <!-- =========================
             SIDE MENU
        ========================== -->
        <div class="overlay hidden" id="menuOverlay">

            <div class="side-menu">

                <button
                    class="modal-close"
                    id="closeMenu"
                    type="button"
                    aria-label="Close menu"
                >
                    ×
                </button>

                <div class="menu-brand">
                    <strong>CAMPUS</strong>
                    <span>MARKETPLACE</span>
                </div>

                <div class="menu-links">

                    <button data-menu="home" type="button">
                        🏠 Home
                    </button>

                    <button data-menu="marketplace" type="button">
                        🛍️ Marketplace
                    </button>

                    <button data-menu="favorites" type="button">
                        ❤️ Favorites
                    </button>

                    <button data-menu="profile" type="button">
                        👤 Profile
                    </button>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
